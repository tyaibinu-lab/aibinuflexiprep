function parseCSV(text){text=text.replace(/\r/g,'');const first=text.split('\n')[0]||'';const d=first.includes('\t')?'\t':',';const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}

 return Object.entries(m).map(([k,x])=>({k,acc:x.c/x.t*100,t:x.t})).filter(x=>x.t>=2&&x.acc<60).sort((a,b)=>a.acc-b.acc)}

function stuRefresh(){const e=document.getElementById('stuRows');if(e)e.innerHTML=stuRows()}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sz=150;c.width=c.height=sz;const x=c.getContext('2d');const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);S.photo=c.toDataURL('image/jpeg',.6);const p=$('#s_prev');p.src=S.photo;p.style.display='block'};im.src=rd.result};rd.readAsDataURL(f)}
function addStudent(){const name=v('s_name').trim();if(!name)return toast('Enter the full name');
 const s={id:nextId(),name,cls:v('s_cls'),target:v('s_target'),gender:v('s_gender'),parent:v('s_parent').trim(),phone:v('s_phone').trim(),subjects:[...document.querySelectorAll('.s_sub:checked')].map(x=>x.value),photo:S.photo,date:today()};
 db.students.push(s);S.photo='';if(!save()){db.students.pop();db.counters.student--;return}toast('Saved — ID '+s.id);render();profile(s.id)}
function profile(id){const s=student(id);if(!s)return;const rs=db.results.filter(r=>r.studentId===s.id).slice().reverse();const w=weakTopics(s.id);const a=avgScore(s.id),t=attRate(s.id);
 modal(`<div style="display:flex;gap:12px;align-items:center">${s.photo?`<img class="avatar" src="${s.photo}">`:''}<div><h3 style="margin:0">${esc(s.name)}</h3><span class="muted">${s.id} · ${esc(s.cls)} · ${s.target} candidate</span></div></div>

 if(!q.subject||!q.q)return toast('Subject and question are required');
 if(t==='mcq'){q.opts=['a','b','c','d'].map(k=>v('b_'+k).trim());if(q.opts.some(x=>!x))return toast('Fill in all four options');q.ans=v('b_ans')}else{q.opts=[];q.ans=v('b_model').trim();q.marks=5}

function importQ(){const rows=parseCSV(v('imp'));if(!rows.length)return toast('Paste some rows first');let ok=0,bad=0;
 rows.forEach((r,i)=>{if(i===0&&/^subject$/i.test((r[0]||'').trim()))return;r=r.map(x=>x.trim());const ans=(r[8]||'').toUpperCase();
  if(r.length<9||!r[0]||!r[3]||r.slice(4,8).some(x=>!x)||!'ABCD'.includes(ans)||ans.length!==1){bad++;return}
  db.questions.push({id:uid(),type:'mcq',board:v('imp_board'),subject:canonSubject(r[0]),topic:r[1]||'General',level:(['LOT','MOT','HOT'].includes((r[2]||'').toUpperCase())?r[2].toUpperCase():'MOT'),q:r[3],opts:r.slice(4,8),ans,expl:r[9]||'',approved:true,source:'import'});ok++});
 save();toast(`Imported ${ok}${bad?`, skipped ${bad} bad row(s)`:''}`);render()}

async function aiGen(){const s=db.settings,sub=canonSubject(v('g_sub')),topic=v('g_topic').trim(),n=Math.min(20,+v('g_n')||5),msg=$('#g_msg');
 if(!sub||!topic)return toast('Enter subject and topic');
 msg.textContent='Generating…';
 const prompt=`Write ${n} multiple-choice questions on "${topic}" (${sub}) in the style of WAEC/NECO/UTME for Nigerian senior secondary students, cognitive level ${v('g_level')}. Return ONLY a JSON array, no commentary: [{"q":"","a":"","b":"","c":"","d":"","ans":"A","expl":""}] where ans is A, B, C or D. Make sure exactly one option is correct.`;
 try{const text=await aiCall(prompt);
  const a=text.indexOf('['),b=text.lastIndexOf(']');const arr=JSON.parse(text.slice(a,b+1));let k=0;
  arr.forEach(x=>{const ans=String(x.ans||'').toUpperCase().trim()[0];if(!x.q||!x.a||!x.b||!x.c||!x.d||!'ABCD'.includes(ans||'-'))return;db.questions.push({id:uid(),type:'mcq',board:'ANY',subject:sub,topic,level:v('g_level'),q:x.q,opts:[x.a,x.b,x.c,x.d],ans,expl:x.expl||'',approved:false,source:'ai'});k++});
  save();toast(`${k} draft question(s) added — review and approve them`);S.bankSt='draft';render()}
 catch(e){msg.textContent='Failed: '+e.message}}

function startExam(){const st=student(v('h_id'));if(!st)return toast('Student ID not found');const e=db.exams.find(x=>x.id===v('h_exam'));if(!e)return toast('Choose an exam');
 if(e.own&&!(st.subjects&&st.subjects.length))return toast('This student has no registered subjects — open the student profile and add them');

 if(db.results.some(r=>r.studentId===st.id&&r.examId===e.id)&&!confirm(st.name+' has already taken this exam. Allow another attempt?'))return;
 S.run={mode:'exam',sid:st.id,name:st.name,cls:st.cls,title:e.title,board:e.board,examId:e.id,qs,ans:{},idx:0,endAt:Date.now()+e.minutes*60000,start:Date.now(),instant:false};persist();render()}

 const sub=v('p_sub'),tp=v('p_topic').trim().toLowerCase();let pool=db.questions.filter(q=>q.approved&&q.type==='mcq'&&q.subject===sub&&(!tp||q.topic.toLowerCase().includes(tp)));
 if(!pool.length)return toast('No approved questions for that choice');const qs=shuffle(pool).slice(0,Math.max(1,+v('p_n')||10));
 S.run={mode:'practice',sid:st?st.id:'',name:st?st.name:'Guest',cls:st?st.cls:'',title:'Practice: '+sub+(tp?' — '+v('p_topic'):''),board:st?st.target:'',examId:'',qs,ans:{},idx:0,endAt:null,start:Date.now(),instant:true};render()}
function persist(){if(S.run&&S.run.mode==='exam'){try{localStorage.setItem(RUNKEY,JSON.stringify(S.run))}catch(e){}}}
function resumeRun(){try{S.run=JSON.parse(localStorage.getItem(RUNKEY));render()}catch(e){toast('Could not resume');localStorage.removeItem(RUNKEY)}}
let timerH=null;
function tick(){clearInterval(timerH);const r=S.run;if(!r||!r.endAt)return;const upd=()=>{const left=Math.round((r.endAt-Date.now())/1000),t=document.getElementById('timer');if(t){t.textContent=fmt(left);t.classList.toggle('low',left<=300)}if(left<=0){clearInterval(timerH);toast('Time up — submitting');submitRun(true)}};upd();timerH=setInterval(upd,1000)}
function runHTML(){const r=S.run,q=r.qs[r.idx],a=r.ans[q.id],locked=r.instant&&a!=null;
 let body;
 if(q.type==='mcq'){body=q.opts.map((o,i)=>{const L='ABCD'[i];let c='opt';if(locked){if(L===q.ans)c+=' right';else if(L===a)c+=' wrong'}else if(a===L)c+=' sel';return`<button class="${c}" ${locked?'disabled':''} onclick="pick('${L}')"><b>${L}.</b> <span dir="auto">${esc(o)}</span></button>`}).join('')+(locked?`<div class="card" style="background:#f6faf7"><b>${a===q.ans?'✔ Correct':'✘ The answer is '+q.ans}</b><br>${esc(q.expl||'')}</div>`:'')}
 else body=`<textarea id="th_ans" dir="auto" style="min-height:140px" oninput="S.run.ans['${q.id}']=this.value;persist()" placeholder="Type your answer here">${esc(a||'')}</textarea><p class="muted">Short theory — marked by the teacher after submission (${q.marks||5} marks).</p>`;
 const done=r.qs.filter(x=>r.ans[x.id]!=null&&String(r.ans[x.id]).trim()!=='').length;
 return`<div class="card" style="background:linear-gradient(135deg,var(--navy),var(--pri2));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>${esc(r.title)}</b><br><span class="muted" style="color:#cfe0d6">${esc(r.name)} · ${r.sid||'guest'} · ${done}/${r.qs.length} answered</span></div>${r.endAt?'':'<span class="tag gold">Practice</span>'}</div>
 <div class="card"><span class="tag">${esc(q.subject)}</span><span class="tag">${esc(q.topic)}</span><span class="tag gold">Q${r.idx+1} of ${r.qs.length}</span><p dir="auto" style="font-size:17px;margin:10px 0">${esc(q.q)}</p>${body}
 <p><button class="btn grey" ${r.idx?'':'disabled'} onclick="nav(-1)">◀ Previous</button><button class="btn grey" ${r.idx<r.qs.length-1?'':'disabled'} onclick="nav(1)">Next ▶</button> <button class="btn gold" onclick="submitRun(false)">Submit</button>${r.mode==='practice'?'<button class="btn red" onclick="quitRun()">Quit</button>':''}</p></div>
 <div class="card"><div class="pal">${r.qs.map((x,i)=>`<button class="${r.ans[x.id]!=null&&String(r.ans[x.id]).trim()!==''?'done':''} ${i===r.idx?'cur':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div></div>`}
function pick(L){const r=S.run,q=r.qs[r.idx];if(r.instant&&r.ans[q.id]!=null)return;r.ans[q.id]=L;persist();render()}
function nav(d){S.run.idx=Math.min(S.run.qs.length-1,Math.max(0,S.run.idx+d));persist();render()}
function jump(i){S.run.idx=i;persist();render()}
function quitRun(){if(confirm('Quit this practice?')){clearInterval(timerH);S.run=null;render()}}
function submitRun(auto){const r=S.run;if(!r)return;const un=r.qs.filter(q=>r.ans[q.id]==null||String(r.ans[q.id]).trim()==='').length;
 if(!auto&&!confirm(un?`${un} question(s) unanswered. Submit anyway?`:'Submit your answers now?'))return;
 clearInterval(timerH);let ms=0,mm=0,tm=0;
 const items=r.qs.map(q=>{const g=r.ans[q.id]==null?'':r.ans[q.id];if(q.type==='mcq'){mm++;const c=g===q.ans;if(c)ms++;return{qid:q.id,subject:q.subject,topic:q.topic,type:'mcq',q:q.q,opts:q.opts,ans:q.ans,expl:q.expl,given:g,correct:c}}
  tm+=q.marks||5;return{qid:q.id,subject:q.subject,topic:q.topic,type:'theory',q:q.q,model:q.ans,given:g,max:q.marks||5,marks:null}});
 const res={id:uid(),studentId:r.sid,name:r.name,cls:r.cls,title:r.title,board:r.board,examId:r.examId,date:today(),practice:r.mode==='practice',mcqScore:ms,mcqMax:mm,theoryScore:tm?null:0,theoryMax:tm,items,seconds:Math.round((Date.now()-r.start)/1000)};
 S.run=null;try{localStorage.removeItem(RUNKEY)}catch(e){}
 if(r.mode==='practice'&&!r.sid){res.temp=true}else{db.results.push(res);save()}
 render();showResult(res)}

/* ---------- results ---------- */
function resTable(rs,compact){return`<div class="tw"><table><tr>${compact?'':'<th>Student</th>'}<th>Exam</th><th>Score</th><th>Grade</th><th>Date</th><th></th></tr>${rs.map(r=>{const p=pct(r);return`<tr>${compact?'':`<td>${esc(r.name)}<br><span class="muted">${r.studentId||''} ${esc(r.cls)}</span></td>`}<td>${esc(r.title)}</td><td>${pending(r)?`${r.mcqScore}/${r.mcqMax} <span class="tag gold">theory pending</span>`:Math.round(p)+'%'}</td><td>${pending(r)?'—':grade(p)}</td><td>${r.date}</td><td><button class="btn sm" onclick="showResult('${r.id}')">View</button></td></tr>`}).join('')}</table></div>`}
function resDash(rs){
 const live=rs.filter(r=>!r.temp),m=live.filter(r=>!pending(r)),pend=live.length-m.length,pm=+db.settings.passMark||50;
 if(!m.length)return`<div class="card"><p class="muted">Nothing to chart yet. Charts appear once there are marked results${S.resFilter||S.resClass?' for this filter':''}.</p>${pend?`<span class="tag gold">${pend} awaiting theory marking</span>`:''}</div>`;
 const col=p=>p>=pm+15?'var(--ok)':p>=pm?'var(--gold)':'var(--bad)';
 const ps=m.map(pct),avg=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length),pass=Math.round(ps.filter(p=>p>=pm).length/ps.length*100);
 const nSt=new Set(m.map(r=>r.studentId||r.id)).size;
 /* grades */
 const gs=['A1','B2','B3','C4','C5','C6','D7','E8','F9'],gc={};gs.forEach(g=>gc[g]=0);m.forEach(r=>gc[grade(pct(r))]++);
 const gmax=Math.max(1,...Object.values(gc)),gcol=g=>'ABC'.includes(g[0])?'var(--ok)':'DE'.includes(g[0])?'var(--gold)':'var(--bad)';
 /* subjects + topics from objective answers */
 const sub={},top={};m.forEach(r=>r.items.forEach(i=>{if(i.type!=='mcq')return;const a=sub[i.subject||'General']=sub[i.subject||'General']||{c:0,t:0};a.t++;if(i.correct)a.c++;
  const k=i.topic||'';if(k){const b=top[k]=top[k]||{c:0,t:0};b.t++;if(i.correct)b.c++}}));
 const subs=Object.entries(sub).filter(x=>x[1].t).map(([k,x])=>({k,p:Math.round(x.c/x.t*100),t:x.t})).sort((a,b)=>a.p-b.p).slice(0,10);
 const tops=Object.entries(top).filter(x=>x[1].t>=4).map(([k,x])=>({k,p:Math.round(x.c/x.t*100),t:x.t})).sort((a,b)=>a.p-b.p).slice(0,6);
 const bar=o=>`<div class="hb"><span title="${esc(o.k)}">${esc(o.k.length>22?o.k.slice(0,21)+'…':o.k)}</span><i><u style="width:${o.p}%;background:${col(o.p)}"></u></i><em>${o.p}%</em></div>`;
 /* trend */
 const byD={};m.forEach(r=>{(byD[r.date]=byD[r.date]||[]).push(pct(r))});
 const days=Object.keys(byD).sort().slice(-12).map(d=>({d,p:byD[d].reduce((a,b)=>a+b,0)/byD[d].length}));
 let trend='';if(days.length>1){const W=300,H=90,x=i=>10+i*(W-20)/(days.length-1),y=p=>H-8-p/100*(H-16);
  trend=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;max-width:440px;height:auto" role="img" aria-label="Average score by date"><line x1="10" x2="${W-10}" y1="${y(pm)}" y2="${y(pm)}" stroke="#c9d3cb" stroke-dasharray="4 3"/><polyline fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" points="${days.map((o,i)=>x(i)+','+y(o.p)).join(' ')}"/>${days.map((o,i)=>`<circle cx="${x(i)}" cy="${y(o.p)}" r="3.5" fill="var(--gold)" stroke="var(--green)"><title>${o.d}: ${Math.round(o.p)}%</title></circle>`).join('')}<text x="10" y="${H+12}" font-size="10" fill="#5b6b60">${days[0].d}</text><text x="${W-10}" y="${H+12}" font-size="10" fill="#5b6b60" text-anchor="end">${days[days.length-1].d}</text></svg><div class="muted" style="font-size:12px">Dashed line = pass mark (${pm}%)</div>`}
 /* students */
 const sm={};m.forEach(r=>{const k=r.studentId||r.id,o=sm[k]=sm[k]||{n:r.name,c:r.cls,s:[]};o.s.push(pct(r))});
 const sl=Object.values(sm).map(o=>({n:o.n,c:o.c,p:Math.round(o.s.reduce((a,b)=>a+b,0)/o.s.length),k:o.s.length})).sort((a,b)=>b.p-a.p);
 const rk=o=>`<div class="rank"><span>${esc(o.n)}<small>${esc(o.c||'')} · ${o.k} attempt${o.k>1?'s':''}</small></span><b style="color:${col(o.p)}">${o.p}%</b></div>`;
 const low=sl.filter(o=>o.p<pm).slice(-5).reverse();
 return`<div class="kpi"><div><b>${m.length}</b><span>Marked results</span></div><div><b>${nSt}</b><span>Students</span></div><div><b>${avg}%</b><span>Average score</span></div><div class="${pass>=60?'g':'w'}"><b>${pass}%</b><span>At or above pass mark</span></div><div><b>${Math.round(Math.max(...ps))}%</b><span>Highest score</span></div>${pend?`<div class="w"><b>${pend}</b><span>Awaiting theory marking</span></div>`:''}</div>
 <div class="dgrid"><div class="card"><h3>Grade spread</h3><div class="gcols">${gs.map(g=>`<div><b>${gc[g]||''}</b><u style="height:${Math.round(gc[g]/gmax*86)}%;background:${gcol(g)}"></u>${g}</div>`).join('')}</div></div>
 <div class="card"><h3>Average score over time</h3>${trend||'<p class="muted">Needs results from at least two different dates.</p>'}</div></div>
 <div class="dgrid"><div class="card"><h3>Subjects — weakest first</h3>${subs.map(bar).join('')||'<p class="muted">No objective answers yet.</p>'}</div>
 <div class="card"><h3>Topics to reteach</h3>${tops.map(bar).join('')||'<p class="muted">Needs a few more answers per topic.</p>'}<div class="muted" style="font-size:12px">Topics with at least 4 answers.</div></div></div>
 <div class="dgrid"><div class="card"><h3>Top students</h3>${sl.slice(0,5).map(rk).join('')}</div>
 <div class="card"><h3>Need support <span class="muted" style="font-weight:400;font-size:12px">(below ${pm}%)</span></h3>${low.map(rk).join('')||'<p class="muted">Everyone is at or above the pass mark.</p>'}</div></div>`}
function bySubject(r){const m={};r.items.forEach(i=>{m[i.subject]=m[i.subject]||{c:0,t:0};if(i.type==='mcq'){m[i.subject].t++;if(i.correct)m[i.subject].c++}});return m}
function slipText(r){const p=pct(r),s=db.settings;const sub=Object.entries(bySubject(r)).filter(x=>x[1].t).map(([k,x])=>`• ${k}: ${x.c}/${x.t}`).join('\n');
 const score=r.board==='UTME'?`UTME mock score: ${Math.round(p/100*400)}/400 (${Math.round(p)}%)`:`Score: ${Math.round(p)}% — Grade ${grade(p)}`;

async function bkKey(pw,salt,iter){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBackup(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=250000,key=await bkKey(pw,salt,iter);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{fpb:1,iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}

const te=new TextEncoder(),td=new TextDecoder(),KALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const LICKEY='flexiprep_lic_v1',PACKKEY='flexiprep_packs_v1',DEVKEY='flexiprep_dev_v1';
let DEVC='',DEVQ=0;
const safe=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e&&e.message?e.message:String(e))}};
const b64=u8=>{u8=new Uint8Array(u8);let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const b64u=u8=>b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=String(s);return unb64(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))};
function b32(u8){let bits=0,val=0,o='';for(const x of u8){val=((val<<8)|x)&0xFFFF;bits+=8;while(bits>=5){o+=KALPHA[(val>>>(bits-5))&31];bits-=5}}if(bits>0)o+=KALPHA[(val<<(5-bits))&31];return o}
function normKey(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function keyCheck(body){let n=0;for(let i=0;i<body.length;i++)n+=(KALPHA.indexOf(body[i])+1)*(i+3);return KALPHA[n%32]}
function genKey(){const r=crypto.getRandomValues(new Uint8Array(11));let b='';for(const x of r)b+=KALPHA[x%32];b+=keyCheck(b);return'FPNB-'+b.slice(0,4)+'-'+b.slice(4,8)+'-'+b.slice(8,12)}
function validKey(s){const k=normKey(s);if(k.length!==16||k.slice(0,4)!=='FPNB')return false;const b=k.slice(4);for(const c of b)if(!KALPHA.includes(c))return false;return keyCheck(b.slice(0,11))===b[11]}
function genPin(len){let p='';while(p.length<len){const r=crypto.getRandomValues(new Uint8Array(1))[0];if(r<250)p+=String(r%10)}return p}
function fmtDev(c){return(normKey(c).match(/.{1,4}/g)||[]).join('-')}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'classroom'}
async function saltFor(key){return new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('fpnb-salt|'+normKey(key)))).slice(0,16)}
async function kdf(pin,key,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(String(pin).trim()+'|'+normKey(key)),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,512));return{wrap:bits.slice(0,32),proof:bits.slice(32,64)}}
async function aesEnc(raw,u8){const iv=crypto.getRandomValues(new Uint8Array(12));const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);return{iv,ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,u8))}}
async function aesDec(raw,iv,ct){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct))}
const RSA={name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'};
async function signStr(str){const k=await crypto.subtle.importKey('pkcs8',unb64(db.licAuth.priv),RSA,false,['sign']);return b64u(new Uint8Array(await crypto.subtle.sign(RSA.name,k,te.encode(str))))}
async function makeToken(payload){const s=JSON.stringify(payload);return b64u(te.encode(s))+'.'+await signStr(s)}
async function verifyTok(token,pubB64){const parts=String(token||'').trim().split('.');if(parts.length!==2||!parts[0]||!parts[1])throw new Error('That activation code is not valid');
 let str;try{str=td.decode(unb64u(parts[0]))}catch(e){throw new Error('That activation code is not valid')}
 const k=await crypto.subtle.importKey('spki',unb64(pubB64),RSA,false,['verify']);const ok=await crypto.subtle.verify(RSA.name,k,unb64u(parts[1]),te.encode(str));
 if(!ok)throw new Error('That activation code is not genuine');return JSON.parse(str)}
function pemOf(b){return'-----BEGIN PRIVATE KEY-----\n'+b.match(/.{1,64}/g).join('\n')+'\n-----END PRIVATE KEY-----'}
const kv={db:null,async open(){if(this.db)return this.db;return this.db=await new Promise((res,rej)=>{const r=indexedDB.open('flexiprep_kv',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(k){if(typeof indexedDB==='undefined')return localStorage.getItem('kv_'+k);const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},

async function ensureAuth(){if(db.licAuth&&db.licAuth.priv)return db.licAuth;
 const kp=await crypto.subtle.generateKey({name:RSA.name,modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['sign','verify']);
 db.licAuth={priv:b64(await crypto.subtle.exportKey('pkcs8',kp.privateKey)),pub:b64(await crypto.subtle.exportKey('spki',kp.publicKey)),ckeys:{},created:new Date().toISOString()};save(true);return db.licAuth}

function renderMD(body,images){const lines=esc(body).split('\n');let out='',ul=false,ol=false;const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};
 const inl=s=>s.replace(/!\[([^\]]*)\]\(img:([A-Za-z0-9_-]+)\)/g,(m,a,id)=>images&&typeof images[id]==='string'&&images[id].indexOf('data:image/')===0?`<figure><img src="${images[id]}" alt="${a}"><figcaption>${a}</figcaption></figure>`:'').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>').replace(/_\{([^}]+)\}/g,'<sub>$1</sub>');
 lines.forEach(l=>{const t=l.trim();let m;if(!t){close();return}
  if((m=t.match(/^(#{1,3})\s+(.*)$/))){close();const n=m[1].length+2;out+=`<h${n}>${inl(m[2])}</h${n}>`}
  else if((m=t.match(/^[-*]\s+(.*)$/))){if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+=`<li>${inl(m[1])}</li>`}
  else if((m=t.match(/^\d+[.)]\s+(.*)$/))){if(ul){out+='</ul>';ul=false}if(!ol){out+='<ol>';ol=true}out+=`<li>${inl(m[1])}</li>`}
  else{close();out+=`<p>${inl(t)}</p>`}});close();return`<div class="note" dir="auto">${out}</div>`}
function openNote(id){const cr=curRoom();if(!cr)return toast('Create a classroom first');const n=id?db.notes.find(x=>x.id===id):null;S.noteImgs=Object.assign({},n?n.images:{});S.noteId=id||'';
 modal(`<h3>${n?'Edit note':'New note'}</h3><div class="row"><div><label>Title</label><input id="n_title" value="${esc(n?n.title:'')}"></div><div><label>Subject</label><select id="n_sub">${cr.subjects.map(s=>`<option ${n&&n.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div><label>Topic</label><input id="n_topic" value="${esc(n?n.topic:'')}"></div><div><label>Order</label><input id="n_order" type="number" value="${n?n.order:db.notes.filter(x=>x.cid===cr.id).length+1}"></div></div>
 <label>Content — # Heading · **bold** · *italic* · - bullet · 1. numbered · ^{sup} · _{sub} · ![caption](img:ID)</label><textarea id="n_body" dir="auto" style="min-height:260px">${esc(n?n.body:'')}</textarea>
 <p><label class="btn sm grey" style="margin:2px">Add image<input type="file" accept="image/*" style="display:none" onchange="noteImage(this)"></label><button class="btn sm grey" onclick="noteAI()">Draft with AI</button><button class="btn sm grey" onclick="notePreview()">Preview</button> <span class="muted" id="n_msg"></span></p>
 <p><button class="btn" onclick="saveNote(false)">Save as draft</button><button class="btn gold" onclick="saveNote(true)">Save & publish</button><button class="btn grey" onclick="closeModal()">Close</button></p><div id="n_prev"></div>`)}
function noteImage(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.max(im.width,im.height),sc=Math.min(1,560/m),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const id='i'+uid().slice(-6);S.noteImgs[id]=c.toDataURL('image/jpeg',.6);const t=document.getElementById('n_body'),tag=`\n![describe the image](img:${id})\n`,p=t.selectionStart||t.value.length;t.value=t.value.slice(0,p)+tag+t.value.slice(p);toast('Image added — edit its caption in the text')};im.src=rd.result};rd.readAsDataURL(f)}

const saveNote=safe(async publish=>{const cr=curRoom(),title=v('n_title').trim(),body=v('n_body');if(!title||!body.trim())return toast('Add a title and some content');
 const used={};(body.match(/img:([A-Za-z0-9_-]+)/g)||[]).forEach(m=>{const id=m.slice(4);if(S.noteImgs[id])used[id]=S.noteImgs[id]});

 const r=await post({action:'ai',key:s.syncKey,dev:await getDevCode(),prompt},s.syncUrl);return r.text}

/* ---------- teacher: keys, cards, activation ---------- */
async function issueKeys(cid,o,progress){const cr=room(cid),auth=await ensureAuth(),ck=unb64(auth.ckeys[cid]);let targets=[];
 if(o.mode==='class'){const have=new Set(db.licenses.filter(l=>l.cid===cid).map(l=>l.sid).filter(Boolean));targets=db.students.filter(s=>s.cls===o.cls&&!have.has(s.id)).map(s=>({sid:s.id,label:s.name}))}
 else for(let i=0;i<o.count;i++)targets.push({sid:'',label:(o.label||'Student')+' '+(db.licenses.filter(l=>l.cid===cid).length+i+1)});
 const out=[];let n=0;
 for(const t of targets){let key;do{key=genKey()}while(db.licenses.some(l=>normKey(l.key)===normKey(key)));const pin=genPin(o.pinLen||6);
  const d=await kdf(pin,key,await saltFor(key),cr.iter),enc=await aesEnc(d.wrap,ck);
  const rec={id:uid(),key,cid,seats:o.seats||1,exp:o.exp||'',grace:cr.grace,sid:t.sid,label:t.label,status:'active',created:today(),iter:cr.iter,proof:b64(d.proof),wk:b64(enc.ct),wiv:b64(enc.iv)};
  db.licenses.push(rec);out.push({rec,pin});n++;if(progress)progress(n,targets.length);await new Promise(r=>setTimeout(r,0))}
 save();return out}
const issueUI=safe(async()=>{const cr=curRoom();if(!cr)return toast('Create a classroom first');
 const o={mode:v('k_mode'),cls:v('k_cls'),count:Math.max(1,Math.min(200,+v('k_count')||1)),label:v('k_label').trim()||'Student',seats:Math.max(1,Math.min(10,+v('k_seats')||1)),pinLen:+v('k_pin')===8?8:6,exp:''};
 const m=+v('k_exp')||0;if(m>0){const d=new Date();d.setMonth(d.getMonth()+m);o.exp=d.toISOString().slice(0,10)}
 if(o.mode==='class'&&!db.students.some(s=>s.cls===o.cls))return toast('No students are registered in '+o.cls);
 modal('<h3>Generating keys…</h3><p id="issueProg" class="muted">Please wait</p>');
 const list=await issueKeys(cr.id,o,(i,n)=>{const e=document.getElementById('issueProg');if(e)e.textContent=i+' of '+n});
 if(!list.length){closeModal();return toast('Every student in that class already has a key')}render();showCards(list)});
const reissueUI=safe(async lid=>{const l=db.licenses.find(x=>x.id===lid),cr=room(l.cid);if(!confirm('Create a new PIN for '+(l.label||l.key)+'? The old PIN stops working on new activations. Devices already activated switch to the new PIN the next time they connect to the internet — or reset the devices to cut access immediately.'))return;
 const pin=genPin(6),ck=unb64(db.licAuth.ckeys[l.cid]),d=await kdf(pin,l.key,await saltFor(l.key),l.iter),enc=await aesEnc(d.wrap,ck);l.proof=b64(d.proof);l.wk=b64(enc.ct);l.wiv=b64(enc.iv);save();showCards([{rec:l,pin}])});

/* ---------- student side: packs, activation, unlock ---------- */
const lics=()=>{try{return JSON.parse(localStorage.getItem(LICKEY))||{}}catch(e){return{}}};
const setLic=(cid,o)=>{const l=lics();if(o)l[cid]=o;else delete l[cid];localStorage.setItem(LICKEY,JSON.stringify(l))};
const packs=()=>{try{return JSON.parse(localStorage.getItem(PACKKEY))||{}}catch(e){return{}}};
const setPackMeta=(cid,o)=>{const p=packs();if(o)p[cid]=o;else delete p[cid];localStorage.setItem(PACKKEY,JSON.stringify(p))};
const packBody=async cid=>{const t=await kv.get('pack_'+cid);if(!t)throw new Error('The classroom file is missing — import it again');return JSON.parse(t)};
async function getDevCode(){if(DEVC)return DEVC;let id=null;try{id=localStorage.getItem(DEVKEY)}catch(e){}
 if(!id){id=b64(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem(DEVKEY,id)}catch(e){}}
 const n=typeof navigator!=='undefined'?navigator:{};
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('fpnb-dev|'+id+'|'+(n.platform||'')+'|'+(n.hardwareConcurrency||'')+'|'+(n.deviceMemory||''))));
 return DEVC=b32(h.slice(0,10))}
const PLK='flexiprep_pinlock_v1';
function pinState(cid){try{return(JSON.parse(localStorage.getItem(PLK))||{})[cid]||{n:0,until:0}}catch(e){return{n:0,until:0}}}
function pinSet(cid,o){let a={};try{a=JSON.parse(localStorage.getItem(PLK))||{}}catch(e){}a[cid]=o;try{localStorage.setItem(PLK,JSON.stringify(a))}catch(e){}}
function pinFail(cid){const s=pinState(cid);s.n++;if(s.n>=5){s.until=Date.now()+600000;s.n=0}pinSet(cid,s);return s}
function pinBlocked(cid){const s=pinState(cid);if(s.until>Date.now()){toast('Too many wrong PINs. Try again in '+Math.ceil((s.until-Date.now())/60000)+' minute(s).');return true}return false}

const importPack=safe(async inp=>{const f=inp.files[0];inp.value='';if(!f)return;const txt=await f.text();let p;try{p=JSON.parse(txt)}catch(e){throw new Error('That is not a FlexiPrep classroom file')}
 if(!p||p.fp!==1||!p.id||!p.pub||!p.ct||!p.iv||!p.iter)throw new Error('That is not a FlexiPrep classroom file');
 const old=packs()[p.id];if(old){if(old.pub!==p.pub)throw new Error('This file comes from a different teacher than the classroom you already have');if(old.ver>p.ver)throw new Error('You already have a newer version (v'+old.ver+') of this classroom')}
 await kv.set('pack_'+p.id,txt);setPackMeta(p.id,{id:p.id,name:p.name,level:p.level,subjects:p.subjects,ver:p.ver,exported:p.exported,url:p.url,pub:p.pub,iter:p.iter,counts:p.counts});
 delete S.open[p.id];toast(old?'Classroom updated to v'+p.ver:'Classroom added — activate it with your key and PIN');await enterRoom(p.id)});

async function evalLic(cid){const l=lics()[cid],pk=packs()[cid];if(!l||!pk)return{st:'none'};if(l.revoked)return{st:'revoked',msg:l.reason||''};
 let p;try{p=await verifyTok(l.token,pk.pub)}catch(e){return{st:'invalid'}}
 if(p.cid!==cid)return{st:'invalid'};if(p.dev!==await getDevCode())return{st:'wrongdev',p};
 if(p.exp&&today()>p.exp)return{st:'expired',p};if(p.chk&&Date.now()>p.chk)return{st:'checkin',p};return{st:'ok',p}}
const enterRoom=async cid=>{S.cr={view:'room',id:cid,tab:'notes',noteId:'',state:await evalLic(cid)};render();
 const l=lics()[cid],pk=packs()[cid],st=S.cr.state.st;
 if(l&&pk&&pk.url&&(typeof navigator==='undefined'||navigator.onLine!==false)&&(st==='checkin'||(st==='ok'&&Date.now()-(l.lastchk||0)>864e5)))S.cr.bg=tryCheckin(cid,true).catch(()=>{});return S.cr};
async function tryCheckin(cid,quiet){const l=lics()[cid],pk=packs()[cid];if(!l||!pk||!pk.url){if(!quiet)toast('This classroom file has no online link — ask your teacher for an activation code');return false}
 let ok=false;try{const p=await verifyTok(l.token,pk.pub);const r=await post({action:'checkin',lid:p.lid,dev:await getDevCode(),token:l.token},pk.url);const np=await verifyTok(r.token,pk.pub);
  if(np.cid!==cid||np.dev!==p.dev)throw new Error('Unexpected reply from the server');l.token=r.token;l.lastchk=Date.now();setLic(cid,l);ok=true;if(!quiet)toast('Checked in — access renewed')}
 catch(e){if(e.revoked){l.revoked=true;l.reason=e.message;setLic(cid,l);delete S.open[cid];toast(e.message)}else if(!quiet)toast('Could not reach the server: '+e.message)}
 if(S.cr&&S.cr.id===cid)S.cr.state=await evalLic(cid);await refreshGate();return ok}
const checkinUI=safe(async cid=>{await tryCheckin(cid,false)});
async function finishActivation(cid,key,pin,token,pk){const p=await verifyTok(token,pk.pub);if(p.cid!==cid)throw new Error('That key belongs to a different classroom');if(p.dev!==await getDevCode())throw new Error('That activation code was made for a different device');
 const d=await kdf(pin,key,await saltFor(key),p.iter);let ck;try{ck=await aesDec(d.wrap,unb64(p.wiv),unb64(p.wk))}catch(e){throw new Error('Wrong product key or PIN')}
 setLic(cid,{token,key:normKey(key),lastchk:Date.now(),at:Date.now()});await openRoom(cid,ck);S.cr.state=await evalLic(cid);await refreshGate();toast('Classroom unlocked')}
async function openRoom(cid,ck){const body=await packBody(cid);let c;try{c=JSON.parse(td.decode(await aesDec(ck,unb64(body.iv),unb64(body.ct))))}catch(e){throw new Error('This classroom file does not match your key — ask your teacher for the latest file')}S.open[cid]=c}
const activateOnline=safe(async cid=>{const key=v('a_key'),pin=v('a_pin').trim(),pk=packs()[cid];if(!validKey(key))return toast('That product key is not valid — check it carefully');if(!/^\d{6,8}$/.test(pin))return toast('Enter your 6 or 8 digit PIN');
 if(!pk.url)return toast('This file has no online link. Use offline activation below.');if(pinBlocked(cid))return;
 if(typeof navigator!=='undefined'&&navigator.onLine===false)return toast('You are offline. Use offline activation below.');
 const d=await kdf(pin,key,await saltFor(key),pk.iter);toast('Activating…');
 const r=await post({action:'activate',key:normKey(key),proof:b64(d.proof),dev:await getDevCode(),label:v('a_name').trim()},pk.url);
 await finishActivation(cid,key,pin,r.token,pk)});
const activateOffline=safe(async cid=>{const key=v('a_key'),pin=v('a_pin').trim(),code=v('a_code').trim(),pk=packs()[cid];if(!validKey(key))return toast('That product key is not valid');if(!/^\d{6,8}$/.test(pin))return toast('Enter your 6 or 8 digit PIN');if(!code)return toast('Paste the activation code from your teacher');if(pinBlocked(cid))return;
 try{await finishActivation(cid,key,pin,code.replace(/\s+/g,''),pk)}catch(e){if(/Wrong product key/.test(e.message)){const s=pinFail(cid);throw new Error(e.message+(s.until>Date.now()?' — locked for 10 minutes':''))}throw e}});
const unlockStudent=safe(async cid=>{const pin=v('u_pin').trim();if(pinBlocked(cid))return;const l=lics()[cid],pk=packs()[cid];if(!l)return;const p=await verifyTok(l.token,pk.pub);
 const d=await kdf(pin,l.key,await saltFor(l.key),p.iter);let ck;try{ck=await aesDec(d.wrap,unb64(p.wiv),unb64(p.wk))}catch(e){const s=pinFail(cid);return toast(s.until>Date.now()?'Too many wrong PINs. Locked for 10 minutes.':'Wrong PIN ('+(5-s.n)+' tries left)')}
 pinSet(cid,{n:0,until:0});await openRoom(cid,ck);S.cr.tab='notes';render()});
function lockRoom(cid){delete S.open[cid];render()}
function forgetRoom(cid){if(!confirm('Remove this classroom from this device? You will need your key and PIN (and a free device seat) to add it again.'))return;setLic(cid,null);setPackMeta(cid,null);delete S.open[cid];S.cr={view:'list'};try{kv.set('pack_'+cid,'')}catch(e){}refreshGate()}

const SYNC_COLS=['students','results','attendance','payments','exams','questions','classrooms','licenses','activations'];
const idOf=(c,r)=>c==='attendance'?r.date+'|'+r.cls:r.id;
function hsh(o){const s=JSON.stringify(o);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length}
function computeChanges(){const ch={};let n=0;const now=Date.now();
 SYNC_COLS.forEach(c=>{const meta=db.sync.meta[c]||(db.sync.meta[c]={});const seen={},list=[];
  db[c].forEach(r=>{const id=idOf(c,r);seen[id]=1;const h=hsh(r),m=meta[id];if(!m||m.del||m.h!==h)list.push({id,u:now,h,data:r})});
  Object.keys(meta).forEach(id=>{if(!seen[id]&&!meta[id].del)list.push({id,u:now,del:true})});
  if(list.length){ch[c]=list;n+=list.length}});return{ch,n}}
function pendingCount(){if(pendingCache==null)pendingCache=computeChanges().n;return pendingCache}
function syncCls(){if(!db.settings.syncUrl)return'';if(db.sync.err)return'err';return db.sync.last&&!pendingCount()?'ok':''}

function syncDetail(){const s=db.sync;if(!db.settings.syncUrl)return'Not connected.';return(s.last?'Last sync: '+new Date(s.last).toLocaleString():'Never synced')+' · '+pendingCount()+' change(s) waiting'+(s.err?' · Last error: '+s.err:'')}
function refreshSyncUI(){const b=document.getElementById('syncBadge');if(b){b.textContent=syncLabel();b.className='sync '+syncCls()}const i=document.getElementById('syncInfo');if(i)i.textContent=syncDetail()}
function syncClick(){if(!db.settings.syncUrl){if(!isAdmin())return toast('Ask your admin to set up sync on this device');go('settings')}else syncNow(true)}

async function post(body,url){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const tm=ctl?setTimeout(()=>ctl.abort(),60000):null;
 try{const r=await fetch(url||db.settings.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined});
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error('The URL did not return sync data — check the script is deployed as a Web app with access set to Anyone')}
  if(!j.ok){const er=new Error(j.error||'Server error');er.revoked=!!j.revoked;throw er}return j}
 catch(e){if(e.name==='AbortError')e=new Error('Timed out — try again on a better connection');throw e}finally{if(tm)clearTimeout(tm)}}
function applyRemote(c,list){let n=0;const meta=db.sync.meta[c]||(db.sync.meta[c]={});
 list.forEach(ch=>{const i=db[c].findIndex(r=>idOf(c,r)===ch.id);
  if(ch.del){if(i>=0)db[c].splice(i,1);meta[ch.id]={del:true,u:ch.u}}
  else if(ch.data){if(i>=0)db[c][i]=ch.data;else db[c].push(ch.data);meta[ch.id]={h:hsh(ch.data),u:ch.u}}
  n++});return n}
function applyAll(r){let n=0;Object.keys(r.changes||{}).forEach(c=>{if(SYNC_COLS.includes(c))n+=applyRemote(c,r.changes[c])});return n}
async function syncNow(manual){const s=db.settings;
 if(!s.syncUrl||!s.syncKey){if(manual){toast('Add the Web app URL and sync key in Settings first');go('settings')}return}
 if(syncing)return;if(!navigator.onLine){if(manual)toast('You are offline — changes will sync when internet returns');return}
 clearTimeout(syncT);syncing=true;refreshSyncUI();
 try{let got=0,sent=0;
  if(!db.sync.since){const r0=await post({key:s.syncKey,since:0,changes:{}});got+=applyAll(r0);db.sync.since=r0.serverTime;save(true)}
  const {ch,n}=computeChanges();const r=await post({key:s.syncKey,since:db.sync.since,changes:ch});sent=n;
  const den=r.denied||{};
  SYNC_COLS.forEach(c=>{if(den[c])return;(ch[c]||[]).forEach(x=>{db.sync.meta[c][x.id]=x.del?{del:true,u:x.u}:{h:x.h,u:x.u}})});
  got+=applyAll(r);db.sync.since=r.serverTime;db.sync.last=Date.now();db.sync.role=r.role||db.sync.role||'';
  const dn=Object.keys(den);db.sync.err=dn.length?'This key is not allowed to sync: '+dn.join(', ')+'. Ask the admin.':'';save(true);
  if(manual)toast(dn.length?db.sync.err:`Synced — ${sent} sent, ${got} received`)}
 catch(e){db.sync.err=e.message;save(true);if(manual)toast('Sync failed: '+e.message)}
 finally{syncing=false;pendingCache=null;if(manual&&!S.run)render();else refreshSyncUI()}}
async function testSync(){const s=db.settings;if(!s.syncUrl||!s.syncKey)return toast('Enter the URL and key first');if(!navigator.onLine)return toast('You are offline');
 try{const r=await post({key:s.syncKey,ping:true});db.sync.role=r.role||'';
  if(s.teacherDevice&&r.role==='admin'){s.syncKey='';save(true);render();return toast('That is the ADMIN key. A teacher device must only hold the teacher key, so it was not kept.')}
  save(true);render();toast('Connected to sheet "'+r.name+'" as '+(r.role==='admin'?'ADMIN':'TEACHER')+' ✔')}catch(e){toast('Could not connect: '+e.message)}}
function fullResync(){if(!confirm('Full re-sync downloads everything from the cloud first (cloud copies replace local copies with the same ID), then uploads anything only on this device. Continue?'))return;db.sync.since=0;db.sync.meta={};db.sync.err='';save(true);syncNow(true)}
function gsText(personal){let t=document.getElementById('gs').textContent.replace(/^\s*\n/,'').trimEnd()+'\n';
 if(personal){if(db.settings.syncKey&&!db.settings.teacherDevice)t=t.replace("var SYNC_KEY = 'CHANGE-ME-TO-A-LONG-SECRET';","var SYNC_KEY = "+JSON.stringify(db.settings.syncKey)+";");
  if(db.settings.staffKey)t=t.replace("var STAFF_KEY = 'CHANGE-ME-TO-A-DIFFERENT-SECRET';","var STAFF_KEY = "+JSON.stringify(db.settings.staffKey)+";");
  if(db.licAuth&&db.licAuth.priv)t=t.replace("var LICENSE_PRIVATE_KEY = '';","var LICENSE_PRIVATE_KEY = "+JSON.stringify(pemOf(db.licAuth.priv))+";")}return t}

<script type="text/plain" id="gs">
/**
 * AIBINU FlexiPrep — cloud sync (Google Apps Script web app)
 *
 * SETUP (about 5 minutes):
 * 1. Create a new Google Sheet (name it e.g. "FlexiPrep Data").
 * 2. Extensions > Apps Script. Delete the sample code and paste this whole file.
 * 3. Change BOTH keys below to your own long secret phrases (at least 12 characters, different from each other).
 *      SYNC_KEY  = the ADMIN key. Use it only on the master computer. Never give it to a teacher.
 *      STAFF_KEY = the TEACHER key. Enter it on teachers' devices. It cannot read or change product keys,
 *                  classrooms, activations or (unless you allow it) payments.
 * 4. Deploy > New deployment > type: Web app
 *      Execute as: Me
 *      Who has access: Anyone
 *    Click Deploy, authorise when asked (Advanced > Go to project), copy the Web app URL (ends in /exec).
 * 5. In FlexiPrep: Settings > Online sync. Paste the URL and the same key, then press "Test connection".
 *
 * If you edit this script later: Deploy > Manage deployments > edit > Version: New version > Deploy.
 *
 * CLASSROOM LICENCES: the app can copy this script with your signing key already filled in
 * (Settings > Online sync > Copy script, or Classroom > Licence setup). Students then activate
 * their product key online and the script binds it to one device and signs the activation.
 *
 * The raw data lives in the tabs students / results / attendance / payments / exams / questions.
 * Do not edit those by hand. The tabs ending in _View are readable summaries rebuilt on each sync.
 */
var SYNC_KEY = 'CHANGE-ME-TO-A-LONG-SECRET';
var STAFF_KEY = 'CHANGE-ME-TO-A-DIFFERENT-SECRET';
// Set to true only if teachers should be able to record and see payments.
var STAFF_PAYMENTS = false;
var DEFAULT_ADMIN_KEY_ = 'CHANGE-ME-TO-A-LONG-SECRET';
var DEFAULT_STAFF_KEY_ = 'CHANGE-ME-TO-A-DIFFERENT-SECRET';
// Filled in automatically when you copy the script from the app (Classroom > Licence setup).
var LICENSE_PRIVATE_KEY = '';

// AI helper limits (the AI key itself lives in Script properties, never in this code).
var AI_DAILY_PER_DEVICE = 60;   // requests per device code per day
var AI_DAILY_TOTAL = 400;       // requests for the whole school per day
var AI_MAX_PROMPT = 8000;       // characters

var COLS = ['students', 'results', 'attendance', 'payments', 'exams', 'questions', 'classrooms', 'licenses', 'activations'];
var HEAD = ['id', 'su', 'u', 'deleted', 'json'];

function doGet() {
  return ContentService.createTextOutput('AIBINU FlexiPrep sync is running.');
}

function doPost(e) {
  var out;
  try {
    var raw = e.postData.contents;
    if (raw.length > 6000000) throw new Error('Request too large');
    var req = JSON.parse(raw);
    var isPublic = (req.action === 'activate' || req.action === 'checkin');
    var role = '';
    if (!isPublic) {
      if (SYNC_KEY === DEFAULT_ADMIN_KEY_) throw new Error('Edit SYNC_KEY in the script first');
      if (String(SYNC_KEY).length < 12) throw new Error('SYNC_KEY is too short: use at least 12 characters');
      role = role_(req.key);
      if (!role) {
        Utilities.sleep(2000);               // slows down anyone guessing keys
        audit_('wrong key', 'a request used a wrong sync key (action: ' + (req.action || (req.ping ? 'ping' : 'sync')) + ')');
        throw new Error('Wrong sync key');
      }
    }
    if (req.action === 'ai') {
      out = ai_(req);
    } else {
      var lock = LockService.getScriptLock();
      lock.waitLock(25000);
      try {
        if (req.action === 'activate') out = activate_(req, false);
        else if (req.action === 'checkin') out = activate_(req, true);
        else if (req.ping) out = { ok: true, serverTime: Date.now(), name: SpreadsheetApp.getActive().getName(), role: role };
        else out = sync_(req, role);
      } finally {
        lock.releaseLock();
      }
    }
  } catch (err) {
    out = { ok: false, error: String((err && err.message) || err) };
  }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

// Works out who is calling from the key they sent. Returns 'admin', 'staff' or ''.
function same_(a, b) {
  a = String(a || ''); b = String(b || '');
  var d = a.length ^ b.length;
  for (var i = 0; i < Math.max(a.length, b.length); i++) d |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
  return d === 0;
}

function role_(key) {
  if (same_(key, SYNC_KEY)) return 'admin';
  var staffOk = STAFF_KEY !== DEFAULT_STAFF_KEY_ && String(STAFF_KEY).length >= 12 && STAFF_KEY !== SYNC_KEY;
  if (staffOk && same_(key, STAFF_KEY)) return 'staff';
  return '';
}

// Tabs a teacher key may read or write.
function allowed_(role) {
  if (role === 'admin') return COLS;
  return COLS.filter(function (c) {
    if (c === 'classrooms' || c === 'licenses' || c === 'activations') return false;
    if (c === 'payments') return !!STAFF_PAYMENTS;
    return true;
  });
}

// A short log of suspicious events, kept on its own tab (newest at the bottom, last 300 rows).
function audit_(event, detail) {
  try {
    var cache = CacheService.getScriptCache();
    var hk = 'audit_' + new Date().toISOString().slice(0, 13);
    var n = Number(cache.get(hk) || 0);
    if (n >= 40) return;
    cache.put(hk, String(n + 1), 3700);
    var ss = SpreadsheetApp.getActive();
    var sh = ss.getSheetByName('Audit_Log');
    if (!sh) { sh = ss.insertSheet('Audit_Log'); sh.getRange(1, 1, 1, 3).setValues([['Time', 'Event', 'Detail']]).setFontWeight('bold'); sh.setFrozenRows(1); }
    sh.appendRow([new Date().toISOString(), String(event).slice(0, 60), "'" + String(detail).slice(0, 300)]);
    var last = sh.getLastRow();
    if (last > 320) sh.deleteRows(2, last - 300);
  } catch (e) {}
}

// Stops spreadsheet formulas being created from typed text (e.g. a name that starts with =).
function cell_(v) {
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(v)) return "'" + v;
  return v;
}

function sheet_(name) {
  var ss = SpreadsheetApp.getActive();
  var sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.getRange(1, 1, 1, 5).setValues([HEAD]);
    sh.setFrozenRows(1);
    sh.getRange('A:A').setNumberFormat('@');
    sh.getRange('E:E').setNumberFormat('@');
  }
  return sh;
}

function safeParse_(s) {
  try { return JSON.parse(s); } catch (e) { return null; }
}

function json_(ch) {
  if (ch.del) return '';
  var s = JSON.stringify(ch.data);
  if (s.length > 49000 && ch.data && ch.data.photo) {
    ch.data.photo = '';
    s = JSON.stringify(ch.data);
  }
  if (s.length > 49000) throw new Error('Record too large to sync: ' + ch.id);
  return s;
}

function sync_(req, role) {
  var now = Date.now();
  var since = Number(req.since) || 0;
  var changes = req.changes || {};
  var out = { ok: true, serverTime: now, changes: {}, role: role };
  var touched = {};
  var allow = allowed_(role);
  var denied = {}, deniedAny = false;
  COLS.forEach(function (c) {
    if (allow.indexOf(c) < 0 && changes[c] && changes[c].length) { denied[c] = changes[c].length; deniedAny = true; }
  });
  if (deniedAny) {
    out.denied = denied;
    audit_('blocked write', role + ' key tried to change: ' + Object.keys(denied).join(', '));
  }

  allow.forEach(function (c) {
    var sh = sheet_(c);
    var last = sh.getLastRow();
    var rows = last > 1 ? sh.getRange(2, 1, last - 1, 5).getValues() : [];
    var idx = {};
    for (var i = 0; i < rows.length; i++) idx[rows[i][0]] = i;
    var base = rows.length;
    var accepted = {}, lost = {}, dirty = {}, dirtyCount = 0;

    (changes[c] || []).forEach(function (ch) {
      var id = String(ch.id);
      var u = Number(ch.u) || 0;
      var row = [id, now, u, ch.del ? 1 : 0, json_(ch)];
      var k = idx[id];
      if (k === undefined) {
        rows.push(row);
        idx[id] = rows.length - 1;
        accepted[id] = 1;
        touched[c] = 1;
      } else if (u >= Number(rows[k][2])) {
        rows[k] = row;
        if (k < base && !dirty[k]) { dirty[k] = 1; dirtyCount++; }
        accepted[id] = 1;
        touched[c] = 1;
      } else {
        lost[id] = 1;
      }
    });

    if (dirtyCount > 30) {
      sh.getRange(2, 1, base, 5).setValues(rows.slice(0, base));
    } else {
      Object.keys(dirty).forEach(function (k) {
        sh.getRange(Number(k) + 2, 1, 1, 5).setValues([rows[k]]);
      });
    }
    if (rows.length > base) {
      sh.getRange(base + 2, 1, rows.length - base, 5).setValues(rows.slice(base));
    }

    var res = [];
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j], rid = r[0];
      if (accepted[rid]) continue;
      if (Number(r[1]) >= since || lost[rid]) {
        var del = Number(r[3]) === 1;
        res.push({ id: rid, u: Number(r[2]), del: del, data: del ? null : safeParse_(r[4]) });
      }
    }
    if (res.length) out.changes[c] = res;
  });

  if (touched.students || touched.results || touched.payments || touched.attendance || touched.licenses || touched.activations || touched.classrooms) refreshViews_();
  return out;
}

/* ---------- classroom licences ---------- */

function b64u_(bytes) {
  return Utilities.base64EncodeWebSafe(bytes).replace(/=+$/, '');
}

function normKey_(s) {
  return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function upsert_(name, data) {
  var sh = sheet_(name), last = sh.getLastRow(), now = Date.now();
  var rows = last > 1 ? sh.getRange(2, 1, last - 1, 5).getValues() : [];
  var row = [data.id, now, now, 0, JSON.stringify(data)];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i][0] === data.id) { sh.getRange(i + 2, 1, 1, 5).setValues([row]); return; }
  }
  sh.getRange(last + 1, 1, 1, 5).setValues([row]);
}

// Handles a student's activation (product key + PIN proof + device code) and later check-ins.
function activate_(req, isCheckin) {
  if (!LICENSE_PRIVATE_KEY) return { ok: false, error: 'Licence signing key is not set in the script' };
  var cache = CacheService.getScriptCache();
  var all = live_('licenses'), lic = null, i;
  if (isCheckin) {
    for (i = 0; i < all.length; i++) if (all[i].id === req.lid) lic = all[i];
  } else {
    var k = normKey_(req.key);
    for (i = 0; i < all.length; i++) if (normKey_(all[i].key) === k) lic = all[i];
  }
  if (!lic) return { ok: false, error: isCheckin ? 'Licence not found' : 'Product key not recognised', revoked: !!isCheckin };
  var dev = normKey_(req.dev);
  if (dev.length !== 16) return { ok: false, error: 'Device code missing' };

  var failKey = 'fail_' + lic.id;
  if (!isCheckin) {
    if (Number(cache.get(failKey) || 0) >= 8) return { ok: false, error: 'Too many wrong attempts. Try again in 15 minutes.' };
    if (req.proof !== lic.proof) {
      cache.put(failKey, String(Number(cache.get(failKey) || 0) + 1), 900);
      return { ok: false, error: 'Wrong product key or PIN' };
    }
  }
  if (lic.status !== 'active') return { ok: false, error: 'This key has been revoked', revoked: true };
  var today = new Date().toISOString().slice(0, 10);
  if (lic.exp && today > lic.exp) return { ok: false, error: 'This key expired on ' + lic.exp, revoked: true };

  var acts = live_('activations').filter(function (a) { return a.lid === lic.id; });
  var mine = acts.filter(function (a) { return a.dev === dev; })[0];
  if (isCheckin && !mine) return { ok: false, error: 'This device is no longer activated', revoked: true };
  // A check-in must present the signed token this device last received. The server keeps only
  // hashes of the current and the previous token, so a reply lost in transit never locks a student out.
  // Activations made before this check existed are accepted once and bound from then on.
  var presentedHash = '';
  if (isCheckin) {
    var prior = String(req.token || '');
    presentedHash = prior ? b64u_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, prior, Utilities.Charset.UTF_8)) : '';
    if (mine.tokenHash) {
      var okProof = presentedHash && (same_(presentedHash, mine.tokenHash) || (mine.prevHash && same_(presentedHash, mine.prevHash)));
      if (!okProof) return { ok: false, error: 'This device\'s activation proof is out of date. Reactivate once with your product key and PIN.' };
    }
  }
  var seats = Number(lic.seats) || 1;
  if (!mine) {
    if (acts.length >= seats) {
      return { ok: false, error: 'This key is already used on the maximum number of devices (' + seats + '). Ask your teacher to reset it.' };
    }
    upsert_('activations', { id: lic.id + '|' + dev, lid: lic.id, dev: dev, label: String(req.label || '').slice(0, 60), at: new Date().toISOString(), cid: lic.cid });
    refreshViews_();
  }
  cache.remove(failKey);

  var cname = '';
  var rooms = live_('classrooms');
  for (i = 0; i < rooms.length; i++) if (rooms[i].id === lic.cid) cname = rooms[i].name;
  var now = Date.now(), grace = Number(lic.grace) || 0;
  var payload = { v: 1, lid: lic.id, cid: lic.cid, cname: cname, dev: dev, exp: lic.exp || '', iat: now, chk: grace ? now + grace * 86400000 : 0, iter: lic.iter, wk: lic.wk, wiv: lic.wiv };
  var str = JSON.stringify(payload);
  var sig = Utilities.computeRsaSha256Signature(str, LICENSE_PRIVATE_KEY);
  var token = b64u_(Utilities.newBlob(str).getBytes()) + '.' + b64u_(sig);
  var activation = mine || { id: lic.id + '|' + dev, lid: lic.id, dev: dev, label: String(req.label || '').slice(0, 60), at: new Date().toISOString(), cid: lic.cid };
  activation.prevHash = isCheckin ? presentedHash : (mine && mine.tokenHash) || '';
  activation.tokenHash = b64u_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, token, Utilities.Charset.UTF_8));
  upsert_('activations', activation);
  return { ok: true, token: token };
}

/* ---------- AI helper: the provider key stays here, never on a phone or laptop ---------- */

function ai_(req) {
  var props = PropertiesService.getScriptProperties();
  var key = props.getProperty('AI_KEY');
  if (!key) return { ok: false, error: 'AI is not set up yet. In Apps Script open Project Settings > Script properties and add AI_KEY.' };
  var prompt = String(req.prompt || '');
  if (!prompt) return { ok: false, error: 'Empty request' };
  if (prompt.length > AI_MAX_PROMPT) return { ok: false, error: 'That request is too long' };
  var cache = CacheService.getScriptCache();
  var day = Utilities.formatDate(new Date(), 'Etc/UTC', 'yyyy-MM-dd');
  var deviceInput = String(req.dev || 'unknown').replace(/[^A-Za-z0-9]/g, '').slice(0, 80) || 'unknown';
  var deviceHash = b64u_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, deviceInput, Utilities.Charset.UTF_8)).slice(0, 32);
  var dk = 'ai_' + day + '_' + deviceHash, tk = 'ai_' + day + '_total';
  var quotaLock = LockService.getScriptLock();
  quotaLock.waitLock(15000);
  try {
    var dn = Number(cache.get(dk) || 0), tn = Number(cache.get(tk) || 0);
    if (dn >= AI_DAILY_PER_DEVICE) return { ok: false, error: 'This device has reached its daily AI limit. Try again tomorrow.' };
    if (tn >= AI_DAILY_TOTAL) return { ok: false, error: 'The school has reached its daily AI limit. Try again tomorrow.' };
    cache.put(dk, String(dn + 1), 90000);
    cache.put(tk, String(tn + 1), 90000);
  } finally {
    quotaLock.releaseLock();
  }

  var provider = String(props.getProperty('AI_PROVIDER') || 'openai').toLowerCase();
  var model = props.getProperty('AI_MODEL') || '';
  var url, opts;
  if (provider === 'gemini') {
    model = model || 'gemini-2.0-flash';
    url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
    opts = { method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': key }, muteHttpExceptions: true,
      payload: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 4096 } }) };
  } else {
    model = model || 'gpt-4o-mini';
    url = 'https://api.openai.com/v1/chat/completions';
    opts = { method: 'post', contentType: 'application/json', headers: { Authorization: 'Bearer ' + key }, muteHttpExceptions: true,
      payload: JSON.stringify({ model: model, messages: [{ role: 'user', content: prompt }] }) };
  }
  var res = UrlFetchApp.fetch(url, opts);
  var code = res.getResponseCode();
  var body = safeParse_(res.getContentText());
  if (code < 200 || code >= 300) {
    var m = (body && body.error && (body.error.message || body.error)) || ('HTTP ' + code);
    return { ok: false, error: 'AI provider error: ' + String(m).split(key).join('***').slice(0, 200) };
  }
  var text = '';
  if (provider === 'gemini') {
    var parts = body && body.candidates && body.candidates[0] && body.candidates[0].content && body.candidates[0].content.parts;
    text = parts ? parts.map(function (p) { return p.text || ''; }).join('') : '';
  } else {
    text = (body && body.choices && body.choices[0] && body.choices[0].message && body.choices[0].message.content) || '';
  }
  if (!text) return { ok: false, error: 'The AI returned no text' };
  return { ok: true, text: text };
}

/* ---------- readable views ---------- */

function live_(name) {
  var sh = sheet_(name), n = sh.getLastRow();
  if (n < 2) return [];
  var v = sh.getRange(2, 1, n - 1, 5).getValues(), out = [];
  v.forEach(function (r) {
    if (Number(r[3]) !== 1) {
      var d = safeParse_(r[4]);
      if (d) out.push(d);
    }
  });
  return out;
}

function grade_(p) {
  return p >= 75 ? 'A1' : p >= 70 ? 'B2' : p >= 65 ? 'B3' : p >= 60 ? 'C4' : p >= 55 ? 'C5' : p >= 50 ? 'C6' : p >= 45 ? 'D7' : p >= 40 ? 'E8' : 'F9';
}

function view_(name, head, rows, textCols) {
  var ss = SpreadsheetApp.getActive();
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clearContents();
  sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');
  sh.setFrozenRows(1);
  if (rows.length) {
    (textCols || []).forEach(function (c) { sh.getRange(2, c, rows.length, 1).setNumberFormat('@'); });
    sh.getRange(2, 1, rows.length, head.length).setValues(rows.map(function (r) { return r.map(cell_); }));
  }
}

function refreshViews_() {
  var students = live_('students');
  view_('Students_View',
    ['ID', 'Name', 'Class', 'Preparing for', 'Gender', 'Parent', 'Parent phone', 'Registered', 'Subjects'],
    students.map(function (s) { return [s.id, s.name, s.cls, s.target, s.gender, s.parent || '', s.phone || '', s.date || '', (s.subjects || []).join(', ')]; }),
    [1, 7]);

  var results = live_('results').sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  view_('Results_View',
    ['Date', 'Student ID', 'Name', 'Class', 'Exam', 'Board', 'MCQ', 'Theory', 'Percent', 'Grade', 'Practice'],
    results.map(function (r) {
      var pend = r.theoryMax > 0 && (r.theoryScore === null || r.theoryScore === undefined);
      var t = (r.mcqMax || 0) + (r.theoryMax || 0);
      var p = t ? ((r.mcqScore || 0) + (r.theoryScore || 0)) / t * 100 : 0;
      return [r.date, r.studentId || '', r.name, r.cls || '', r.title, r.board || '',
        r.mcqScore + '/' + r.mcqMax,
        r.theoryMax ? (pend ? 'pending' : r.theoryScore + '/' + r.theoryMax) : '-',
        pend ? '' : Math.round(p), pend ? 'Pending' : grade_(p), r.practice ? 'Yes' : 'No'];
    }),
    [2]);

  var pays = live_('payments').sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  view_('Payments_View',
    ['Receipt', 'Date', 'Student ID', 'Name', 'Amount', 'For month', 'Method', 'Note'],
    pays.map(function (p) { return [p.no, p.date, p.studentId, p.name, Number(p.amount), p.month, p.method, p.note || '']; }),
    [3]);

  var lics = live_('licenses'), acts = live_('activations'), rooms = live_('classrooms');
  view_('Licenses_View',
    ['Product key', 'Classroom', 'Holder', 'Seats', 'Devices used', 'Expires', 'Status', 'Devices'],
    lics.map(function (l) {
      var room = rooms.filter(function (r) { return r.id === l.cid; })[0];
      var mine = acts.filter(function (a) { return a.lid === l.id; });
      return [l.key, room ? room.name : '', l.label || '', Number(l.seats) || 1, mine.length, l.exp || '', l.status,
        mine.map(function (a) { return (a.label || 'device') + ' (' + String(a.at || '').slice(0, 10) + ')'; }).join('; ')];
    }),
    [1]);

  var att = live_('attendance').sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  view_('Attendance_View',
    ['Date', 'Class', 'Present', 'Absent', 'Absent IDs'],
    att.map(function (a) {
      var ids = Object.keys(a.marks || {}), ab = ids.filter(function (i) { return a.marks[i] === 'A'; });
      return [a.date, a.cls, ids.length - ab.length, ab.length, ab.join(', ')];
    }),
    [1]);
}
